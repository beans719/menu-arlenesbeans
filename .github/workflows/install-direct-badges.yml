name: Install direct dietary badges

on:
  push:
    paths:
      - '.github/workflows/install-direct-badges.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject badge enhancer into original production pages
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('screen-1-portrait-tested.html'),
              Path('screen-2-portrait.html'),
              Path('screen-3-portrait.html'),
          ]
          tag = '<script src="dietary-direct.js?v=20260915-direct"></script>'

          for path in targets:
              text = path.read_text(encoding='utf-8')
              if 'dietary-direct.js' in text:
                  continue
              if '</body>' not in text:
                  raise SystemExit(f'Missing </body> in {path}')
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/install-direct-badges.yml').unlink()
          PY
      - name: Commit production badge integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screen-1-portrait-tested.html screen-2-portrait.html screen-3-portrait.html .github/workflows/install-direct-badges.yml
          git commit -m 'Enable dietary badges on original production URLs'
          git push
